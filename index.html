<title>Presidents &amp; Assholes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap" crossorigin>
<style>
/* Committed look: the Oval Office after hours. Navy and gold in every theme. */
:root{
  color-scheme:dark;
  --bg:#0c1230; --surface:#141c42; --surface-2:#1d2756; --ink:#f3f1ea; --muted:#a9b0cf; --line:#2b3668;
  --gold:#e8b93c; --gold-ink:#1a1405; --red:#ef4c5f; --good:#6fd1a0;
  --lead:#2a2a3a; --err:#ff8a8a; --err-bg:#3a1c26;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Figtree",system-ui,sans-serif;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:800;color:var(--gold)}
.num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{padding:9px 6px;border-radius:10px;font-size:15px}
.tab[aria-selected="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
button,select{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:10px 14px;font-weight:600}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-size:17px;padding:14px;font-weight:800}
.ghost{background:transparent}
.small{padding:6px 10px;font-size:14px}
.danger{color:var(--err);border-color:var(--err);background:transparent}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
input[type=text],input[type=search],select,textarea{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.hint{font-size:14px;color:var(--muted);margin:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 13px;border-radius:999px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:46px;height:46px;font-size:22px;padding:0}
.stepper .count{font-family:"Bricolage Grotesque",sans-serif;font-size:34px;font-weight:800;min-width:40px;text-align:center}
.names{display:flex;flex-direction:column;gap:8px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle .tl{font-weight:600}
.toggle .ts{display:block;font-size:13px;color:var(--muted);font-weight:400}
.switch{width:52px;height:30px;border-radius:999px;padding:0;position:relative;background:var(--bg);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:left .15s}
.switch[aria-checked="true"]{background:var(--gold);border-color:var(--gold)}
.switch[aria-checked="true"]::after{left:25px;background:var(--gold-ink)}

/* cabinet */
.cabinet{display:flex;flex-direction:column;gap:6px}
.seat{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.seat.pres{border-color:var(--gold);background:linear-gradient(90deg,rgba(232,185,60,.18),transparent)}
.seat.ass{border-color:var(--red);background:linear-gradient(90deg,rgba(239,76,95,.16),transparent)}
.seat .ico{font-size:20px;width:28px;text-align:center}
.seat .nm{font-weight:800;overflow-wrap:anywhere}
.seat .rk{font-size:13px;font-weight:700;color:var(--muted);text-align:right}
.seat.pres .rk{color:var(--gold)} .seat.ass .rk{color:var(--red)}
.swap{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:12px;border:1px dashed var(--gold);font-size:14px}
.swap b{color:var(--gold)}

/* rule cards */
.drawn{border-radius:16px;padding:20px;background:linear-gradient(160deg,#f6e3a6,#e8b93c);color:var(--gold-ink);display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.drawn .cat{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;opacity:.75}
.drawn .rt{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:800;line-height:1.1}
.drawn .rd{font-size:16px}
.drawn .rx{font-size:14px;line-height:1.4;padding-top:8px;border-top:1px solid rgba(26,20,5,.2)}
.drawn button{background:rgba(26,20,5,.08);color:var(--gold-ink);border-color:rgba(26,20,5,.25)}
.drawn button.go{background:var(--gold-ink);color:var(--gold);border-color:var(--gold-ink)}
@media (prefers-reduced-motion:no-preference){.drawn{animation:flip .35s ease-out}@keyframes flip{from{transform:rotateX(70deg);opacity:.2}to{transform:none;opacity:1}}}
.active{display:flex;flex-direction:column;gap:8px}
.law{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border-radius:12px;background:var(--bg);border-left:4px solid var(--gold)}
.law .lt{font-weight:800}
.law .ld{font-size:14px;color:var(--muted);grid-column:1}
.law .lm{font-size:12px;color:var(--muted);grid-column:1}
.law button{grid-row:1 / 5;grid-column:2;align-self:center}
.law .how{grid-column:1}
.endbtn{flex:0 0 auto}
.gameover{background:linear-gradient(160deg,#f6e3a6,#e8b93c);color:var(--gold-ink);border:0}
.gameover .eyebrow{color:inherit;opacity:.75}
.gameover h2{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;line-height:1.1;margin:0}
.gameover p{margin:0;font-weight:700}
.gameover button{background:rgba(26,20,5,.08);color:var(--gold-ink);border-color:rgba(26,20,5,.25)}
.gameover button#rematch{background:var(--gold-ink);color:var(--gold);border-color:var(--gold-ink)}
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.sin{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.shead{display:flex;align-items:flex-start;gap:12px;position:sticky;top:calc(-10px - env(safe-area-inset-top,0px));z-index:1;background:var(--bg);padding:10px 0 8px}
.shead h2{margin:0}
.pkcats{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pkcats::-webkit-scrollbar{display:none}
.pkcats .chip{white-space:nowrap;flex:none}
.ritem.pk{grid-template-columns:1fr auto}
.ritem.pk .en[disabled]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);opacity:1}
.pkh{margin:14px 0 2px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.how summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--gold);list-style:none;display:inline-flex;align-items:center;gap:4px;padding:4px 0;min-height:28px}
.how summary::-webkit-details-marker{display:none}
.how summary::before{content:"▸";transition:transform .15s}
.how[open] summary::before{transform:rotate(90deg)}
.how p{margin:2px 0 4px;font-size:14px;line-height:1.45;color:var(--ink)}
.rlist{display:flex;flex-direction:column}
.ritem{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.ritem:last-child{border-bottom:0}
.star{background:transparent;border:0;font-size:22px;padding:2px 4px;line-height:1;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--gold)}
.ritem .t{font-weight:800}
.ritem .d{font-size:14px;color:var(--muted)}
.ritem .c{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-weight:800}
.ritem .en{font-size:13px;padding:6px 10px}
.ritem .en[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.count-note{font-size:13px;color:var(--muted)}

/* round entry */
.orderchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.oc{display:flex;align-items:center;gap:8px;justify-content:flex-start;text-align:left;padding:10px 12px}
.oc .badge{min-width:26px;height:26px;border-radius:50%;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;border:1px solid var(--line)}
.oc.picked{border-color:var(--gold)}
.oc.picked .badge{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.err{background:var(--err-bg);color:var(--err);padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px}

/* history & stats */
.hrow{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .o{font-size:14px;overflow-wrap:anywhere}
.hrow .o b{color:var(--gold)} .hrow .o i{color:var(--red);font-style:normal;font-weight:700}
.hl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aw{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.aw .an{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-weight:800}
.aw .ah{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;overflow-wrap:anywhere}
.aw .ad{font-size:13px;color:var(--muted)}
.stwrap{overflow-x:auto}
table.st{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
table.st th,table.st td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.st th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
table.st th:first-child,table.st td:first-child{text-align:left}
@media (max-width:380px){.hl{grid-template-columns:1fr}}

/* how to play */
.guide{display:flex;flex-direction:column;gap:12px}
.guide section{display:flex;flex-direction:column;gap:6px}
.guide p,.guide li{font-size:15px;line-height:1.55;max-width:65ch}
.guide p{margin:0}
.guide ul,.guide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.ranks{display:flex;flex-wrap:wrap;gap:4px;font-weight:800;font-variant-numeric:tabular-nums}
.ranks span{padding:4px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.ranks span.hi{border-color:var(--gold);color:var(--gold)}
.rtable{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}
.rtable dt{font-weight:800;color:var(--gold)} .rtable dd{margin:0}

/* hx:css:start */
/* game history (shared) */
.hx-hbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.hx{display:flex;flex-direction:column;gap:18px;--hx-acc:var(--accent,var(--gold,var(--amber,#8a5a00)));--hx-bad:var(--err,var(--red,var(--bad,#b3261e)))}
.hx-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hx-top h1{margin:0}
.hx .stwrap{overflow-x:auto}
.hx table.st{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
.hx table.st th,.hx table.st td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
.hx table.st th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.hx table.st th:first-child,.hx table.st td:first-child{text-align:left}
.hx select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.hx-awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hx-award{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:2px;min-width:0}
.hx-an{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--hx-acc);font-weight:800}
.hx-aw{font-weight:800;font-size:18px;overflow-wrap:anywhere}
.hx-ad{font-size:13px;color:var(--muted)}
.hx-log{display:flex;flex-direction:column}
.hx-game{display:flex;flex-direction:column;gap:6px;padding-block:12px;border-top:1px solid var(--line)}
.hx-game:first-child{border-top:0;padding-top:0}
.hx-meta{display:flex;flex-direction:column;gap:2px}
.hx-scores{font-size:15px;overflow-wrap:anywhere}
.hx-win{color:var(--hx-acc);font-weight:700}
.hx-tag{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border:1px solid currentColor;border-radius:6px;padding:0 5px;margin-right:4px}
.hx-btns>*{flex:0 0 auto}
.hx-card{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.hx-sc td{line-height:1.25}
.hx table.hx-sc th{white-space:normal;min-width:48px}
.hx table.hx-sc th:first-child{min-width:0}
.hx-run{display:block;font-size:11px;color:var(--muted);font-weight:400}
.hx-tot td{font-weight:800;border-bottom:0}
.hx-won{color:var(--hx-acc)}
.hx-nudge{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--hx-acc);border-radius:12px;background:var(--surface);font-size:14px;font-weight:600}
.hx-link{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--hx-acc);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.hx .danger{color:var(--hx-bad);border-color:var(--hx-bad)}
.hx-saved{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.hx-saved>button{flex:0 0 auto}
.hx-paste{font:inherit;font-size:16px;width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
/* hx:css:end */
</style>

<script>
const KEY = "presidents-game-v1", PREFS = "presidents-prefs-v1";
const CROWN = `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#1d2756"/><path d="M20 66 L17 36 L34 50 L50 26 L66 50 L83 36 L80 66 Z" fill="#e8b93c"/><rect x="20" y="68" width="60" height="9" rx="2" fill="#e8b93c"/><circle cx="50" cy="55" r="5" fill="#c8243a"/></svg>`;

// ---------- the rule deck ----------
// Each rule: [category, title, what it says, how it works in practice].
const CATS = {
  talk:"Talk", body:"Body", table:"Table & cards", social:"Social", sips:"Drink mechanics", power:"Presidential power", mini:"Mini-games", wild:"Wild",
};
const RULES = [
  // Talk
  ["talk","No first names","Nobody may say anyone's first name. Slip up and take a sip.","Nicknames, last names and pointing are all fine; first names aren't, and that includes your own. Whoever catches a slip calls it out, and the person who said the name sips."],
  ["talk","Swear jar","Every curse word costs a sip.","Every curse word counts, even mild ones and even muttered, as long as someone hears it. Each word is its own sip, so a string of three costs three."],
  ["talk","The D-word","The word “drink” is banned. Call it “a sip of freedom” instead.","Don't say “drink,” “drinks” or “drinking.” Say “a sip of freedom” instead. Say the banned word and you sip, and you still have to call it a sip of freedom."],
  ["talk","Pirate law","Everyone talks like a pirate until the next President takes office.","Everyone talks like a pirate: “arr,” “matey,” “aye” for yes. It ends when this round is over and the next President is crowned. Talk like a landlubber and sip."],
  ["talk","The royal we","Everyone refers to themselves only as “we.” Say “I” and sip.","Say “we,” “us” and “our” instead of “I,” “me” and “my”: “We shall play a pair.” Saying “I” or “me” costs a sip."],
  ["talk","Third person","Everyone refers to themselves by name in the third person.","Talk about yourself by your own name: “Sam passes,” not “I pass.” Say “I,” “me” or “my” and sip."],
  ["talk","No yes, no no","The words “yes” and “no” are banned. Find another way.","“Yeah,” “nope,” “sure” and nodding all work. The words “yes” and “no” don't. Say either one and sip."],
  ["talk","Question master","The President is question master. Answer any question they ask and you sip, unless you reply with a question of your own.","If the President asks you a question and you answer it, you sip. Dodge by answering with a question of your own (“Why do you ask?”). Watch for sneaky ones like “Whose turn is it?”"],
  ["talk","Questions only","Everyone may only speak in questions. Make a statement and sip.","Every sentence must be a question: “Should I play my 9?” Even passing has to be asked (“Pass?”). Make a statement and sip."],
  ["talk","Accent decree","The President picks an accent. Everyone speaks in it.","The President names an accent (British, cowboy, pirate, anything). Everyone uses it whenever they speak, the President included. Drop it and sip."],
  ["talk","No numbers","Nobody may say a number out loud, including card ranks. Show your cards instead.","Don't say any number out loud, card ranks included: no “three,” no “pair of nines.” Lay your cards down to show what you're playing. Saying a number costs a sip."],
  ["talk","Mr. President","The President must be addressed as “Mr. President” or “Madam President.”","Whenever you talk to or about the President, call them “Mr. President” or “Madam President.” Using their name, or just “you,” costs a sip."],
  ["talk","Your Majesty","Every sentence spoken to the President must begin with “Your Majesty.”","Anything you say to the President has to start with “Your Majesty”: “Your Majesty, it's your turn.” Forget and sip."],
  ["talk","Compliment tax","Before you play a card, pay someone a compliment.","Before you put down any card, give someone at the table a compliment, a different person each time if you can. Passing is free. Play without paying the tax and sip."],
  ["talk","Sportscaster","Announce every card you play like a play-by-play commentator.","Call your own play like a sports commentator: “And she drops a pair of Kings! The crowd goes wild!” Play without commentary and sip."],
  ["talk","Manners","Forget “please” or “thank you” and take a sip.","Ask with “please” and answer with “thank you,” for cards, drinks, anything. Get caught forgetting and sip."],
  ["talk","Whisper zone","Everyone must whisper. Raise your voice and sip.","Everyone talks in a whisper, even when excited. Laughing is allowed, but talk at normal volume and you sip."],
  ["talk","Movie line","Every play must come with a movie quote. No quote, no play.","Say a movie quote every time you play cards. No quote, no play: you have to pass instead. Repeats are allowed but expect groans."],
  ["talk","Banned letter","The President bans a letter. Any word starting with it costs a sip.","The President picks a letter. Any word starting with it costs a sip, every time. Common letters like S or T make it brutal; Q or X make it easy."],
  ["talk","Catchphrase","The President picks a catchphrase. Whoever clears the pile must shout it.","The President picks a catchphrase, like “Bingo!” Whoever clears the pile, by a 2 or because everyone passed, shouts it right away. Forget and sip."],
  ["talk","Boom","Playing a 2 requires a loud “BOOM.” Forget and sip.","Every time you play a 2, or a pair of them, shout “BOOM.” If the table catches you forgetting, you sip."],
  ["talk","Opposite day","Yes means no and no means yes until the pile clears twice.","Everyone answers the opposite of what they mean, so “no” means yes. It ends after the pile has cleared twice. Answer straight and sip."],
  ["talk","Narrator","The player left of the President narrates everyone's turns in a nature-documentary voice.","The player to the President's left describes every turn like a nature documentary: “The Asshole, sensing danger, plays a lonely 4.” If the narrator goes quiet, they sip."],
  ["talk","President says","The President's commands only count if they start with “President says.” Follow a fake one and sip.","Like Simon Says: the President's orders only count when they start with “President says.” Obey an order without it, or ignore a real one, and you sip."],
  ["talk","Over and out","End every sentence with “over,” like a radio. Forget and sip.","End everything you say with “over,” like a walkie-talkie. Finish a sentence without it and sip."],
  ["talk","Robot mode","Everyone talks like a robot until the next round.","Talk in a flat robot voice, beeps welcome. It ends when this round is over and the next deal starts. Slip into your normal voice and sip."],
  ["talk","No “you”","The word “you” is banned. Point with your elbow instead.","Don't say the word “you.” To mean someone, point at them with your elbow. Say “you” and sip, and finger-pointing doesn't count."],
  ["talk","Hashtag","End every sentence with a hashtag, spoken out loud.","Finish every sentence with a spoken hashtag: “I pass, hashtag blessed.” Forget and sip."],
  ["talk","Ye olde","Everyone speaks like Shakespeare. Thee, thou, and forsooth.","Talk like Shakespeare: thee, thou, doth, forsooth, “I prithee, play thy card.” Modern talk costs a sip."],
  ["talk","Good vibes only","No complaining about your cards. Complain and sip.","No grumbling about your hand, the deal or your luck. Big sighs count if the table says so. Complain and sip."],
  ["talk","Trash talk","Trash talk is mandatory before every play. Keep it friendly.","Before every play, say something cocky but friendly: “Enjoy your last turn as Vice President.” Play without trash talk and sip. No real insults."],
  ["talk","Echo","Repeat the last word the previous player said before you speak.","Before you say anything, repeat the last word the previous speaker said. Forget and sip."],
  ["talk","Sing it","Anyone down to one card must sing “last card” to a tune of their choice.","When you're down to your last card, sing “last card” to any tune. If someone catches you holding one card without singing, you sip."],
  ["talk","Speechwriter","Before each round, the Asshole gives a 10-second speech praising the President.","Before every deal, the Asshole gives a 10-second speech praising the President. If the President isn't impressed, the Asshole sips."],
  ["talk","Name that card","Name the card you're playing in a foreign language. Any language.","When you play, name the card in another language: “dos” for a 2, “roi” for a King. Any language counts. Say it in English and sip."],
  ["talk","Slow talker","Everyone speaks slowly and dramatically. Talk fast and sip.","Everyone talks slowly and dramatically, like a movie villain. Talk at normal speed and the table can make you sip."],
  ["talk","Weather report","Announce your mood as a weather forecast before you play.","Before each play, describe your mood as a forecast: “Cloudy, with a chance of pairs.” Skip the forecast and sip."],
  ["talk","Sir and ma'am","Address everyone at the table as sir or ma'am.","Call everyone “sir” or “ma'am” whenever you talk to them, the President included. Forget and sip."],
  ["talk","Shush","Nobody may speak while the President is playing a card.","When it's the President's turn, nobody talks until their cards are down or they pass. Break the silence and sip."],
  ["talk","Pun-ishment","Whoever clears the pile must make a pun. A groan from the table means a sip.","Whoever clears the pile makes a pun right away, ideally about cards. If anyone groans, the punner sips. Fake groans count."],
  // Body
  ["body","Thumb master","The President can put a thumb on the table at any time. Last to copy sips.","Whenever they like, the President quietly rests a thumb on the table. Everyone who notices copies. The last person to put a thumb down sips. The sneakier, the better."],
  ["body","Heaven","The President points to the sky whenever they like. Last to point up sips.","Whenever they like, the President points at the sky. Everyone copies. The last person to point up sips."],
  ["body","No pointing","No pointing with fingers. Elbows only.","Keep your fingers folded. Point with an elbow, a nod or your chin instead. Point with a finger and sip."],
  ["body","Wrong hand","Everyone drinks with their non-dominant hand.","Hold your drink in your non-dominant hand every time you sip, so lefties use their right. Get caught using your usual hand and sip again."],
  ["body","Pinky out","Pinkies up whenever you sip. Forget and sip again.","Lift your pinky every time you drink, like at a fancy tea party. Forget and you take another sip, pinky up this time."],
  ["body","Salute","Salute the President before you play a card.","Before you play any card, salute the President. Passing doesn't need a salute. Forget and sip."],
  ["body","The bow","Bow your head when you speak to the President.","Bow your head a little whenever you speak to the President. Talk to them head held high and sip."],
  ["body","Stand for 2s","Anyone who plays a 2 must stand up and take a bow.","Whenever you play a 2, stand up and take a bow before sitting back down. Forget and sip."],
  ["body","Cheers first","You must clink glasses with someone before any sip.","Before any sip, clink glasses with someone. Sip without a cheers and you sip again, with a cheers this time."],
  ["body","Forehead card","The Asshole plays one round with a card stuck to their forehead.","For the next round, the Asshole pulls one card from their hand without looking and holds it to their forehead, face out. Everyone else can see it; the Asshole can't. They can still play it."],
  ["body","Viking","The President can start rowing a Viking ship. Everyone joins. Last one rowing sips.","Whenever they like, the President starts rowing an invisible Viking ship. Everyone joins in. The last person to start rowing sips."],
  ["body","Freeze","The President freezes. Everyone freezes. Last to freeze sips.","When the President freezes mid-move, everyone freezes too. The last person to freeze sips, and nobody moves until the President does."],
  ["body","Nose goes","The President touches their nose. Last to copy sips.","Whenever they like, the President touches their nose. Everyone copies. The last person to touch their nose sips."],
  ["body","Hands off","No touching your face. Touch it and sip.","Don't touch your own face: no chin resting, scratching or pushing up glasses. Get caught and sip."],
  ["body","No elbows","No elbows on the table.","Keep your elbows off the table. Get caught and sip."],
  ["body","Dance break","Before you play a 2 you have to do a dance move.","Before you play a 2, bust out a dance move. Anything counts, from a shimmy to the sprinkler. Play a 2 without dancing and sip."],
  ["body","High five","When the pile clears, high-five the player on your left.","Whenever you clear the pile, high-five the player on your left before you lead again. Forget and sip."],
  ["body","T-rex","Play your cards with T-rex arms until the pile clears.","Tuck your elbows against your sides and play with short T-rex arms until the pile clears. Reach normally and sip."],
  ["body","Stand to speak","You have to stand up to talk.","You have to stand up to say anything at all. Talk while sitting and sip."],
  ["body","Knock knock","Knock twice on the table before every play.","Knock twice on the table before you play cards. Passing doesn't need a knock. Forget and sip."],
  ["body","Wink","Wink at someone every time you play. Get caught not winking and sip.","Every time you play cards, wink at someone. If anyone notices a play without a wink, you sip."],
  ["body","Chicken pass","Flap your arms like a chicken when you pass.","Instead of saying “pass,” flap your arms like a chicken. Clucking is optional. Pass without flapping and sip."],
  ["body","Card hand","Hold your drink in the same hand as your cards.","When you drink, use the hand holding your cards, without putting the cards down. Drink with your free hand and sip again."],
  ["body","Silent applause","Jazz hands after the President plays.","Every time the President plays, everyone gives silent jazz hands. Forget and sip."],
  ["body","Mirror","The Asshole copies every move the President makes.","The Asshole copies everything the President does: scratching, sipping, leaning, stretching. If the President catches them not mirroring, the Asshole sips."],
  ["body","Slow motion","Everyone plays their cards in slow motion.","Play your cards in slow motion, slow-motion faces encouraged. Play at normal speed and sip."],
  ["body","Hands up","Last player to raise their hands when the President says “stick 'em up” sips.","Whenever the President says “stick 'em up,” everyone raises both hands. The last one with their hands up sips."],
  ["body","Arm wrestle","The President can challenge anyone to a thumb war. Loser sips.","Whenever they like, the President can challenge anyone to a thumb war (one, two, three, four, I declare a thumb war). The loser sips, even if it's the President."],
  ["body","Seat of power","The Asshole must stand for the whole next round.","The Asshole stays standing for the whole next round, from the deal to the last card. Sitting down costs a sip."],
  ["body","Head tap","Tap your head before you pass. Forget and sip.","Tap the top of your head before you say “pass.” Pass without a tap and sip."],
  // Table & cards
  ["table","Pass tax","Every pass costs a sip.","Each time you say pass, take a sip, whether you could have played or not. If your table already sips on passes, it's two."],
  ["table","Skip sip","Anyone who gets skipped sips.","Whenever your turn gets skipped, by a same-rank play, a Crazy 8 or any other rule, you sip."],
  ["table","Bomb","Four of a kind clears the pile, and everyone else sips.","Playing four of the same rank clears the pile no matter what's on it, and everyone except the bomber sips. The bomber leads next."],
  ["table","Revolution","Four of a kind flips the card order. Low cards win until the pile clears.","When someone plays four of a kind, the card order flips: 3s are now high and 2s are low. It flips back when the pile clears."],
  ["table","Slap","When the same rank is played twice in a row, slap the table. Last to slap sips.","When the same rank is played twice in a row, like a 7 on a 7, everyone slaps the table. The last hand down sips, and so does anyone who slaps at the wrong time."],
  ["table","Jokers wild","Jokers go in the deck and count as any card.","Shuffle two jokers into the deck. A joker can stand in for any card, so a 9 and a joker make a pair of 9s. On its own, a joker can be played as anything, even a 2."],
  ["table","Two clears","A 2 clears the pile, and everyone else sips.","A 2, or a set of them, clears the pile on the spot, and everyone except the player who played it sips. That player leads the next pile."],
  ["table","Singles only","Only single cards may be played this round.","For the rest of this round, every play is a single card: no pairs, triples or four of a kind. Normal play comes back next round."],
  ["table","Pair bonus","Play a pair and give out a sip.","Whenever you play a pair, two of the same rank, give one sip to anyone you choose."],
  ["table","Last card","Announce “last card” when you're down to one. Forget and sip.","When you're down to one card, say “last card” before the next player plays. If someone catches you first, you sip."],
  ["table","Shot clock","Take more than 10 seconds to play and sip.","On your turn you have 10 seconds to play or pass. Anyone can count you down out loud. Run out of time and sip."],
  ["table","Jack reverse","A Jack reverses the direction of play.","Playing a Jack, or a set of Jacks, reverses the direction of play, so the next turn goes back the other way."],
  ["table","Crazy 8s","An 8 skips the next player.","When an 8 is played, the next player in line is skipped."],
  ["table","Seven gives","Play a 7 and give out a sip.","Each 7 you play lets you give one sip to anyone you choose, so a pair of 7s gives out two."],
  ["table","Queen questions","Whoever plays a Queen becomes question master until the pile clears.","Play a Queen and you're question master until the pile clears: anyone who answers a question you ask sips, unless they answer with a question."],
  ["table","Ace cheers","When an Ace is played, everybody cheers.","Whenever an Ace hits the table, everyone raises a glass and shouts “cheers.” The last to cheer sips."],
  ["table","Butler duty","The Asshole deals, collects, and shuffles every round.","Whoever is Asshole collects the cards after every round, shuffles and deals. Nobody else touches the deck."],
  ["table","Show one","The Asshole plays with one card face up on the table.","The Asshole picks one card from their hand and lays it face up on the table for everyone to see. It stays there until they play it."],
  ["table","Double swap","The Asshole gives the President 3 cards instead of 2 next round.","At the next card swap, the Asshole hands over their 3 best cards instead of 2, and the President gives back 3 cards they don't want."],
  ["table","No 2s first","Nobody may lead with a 2.","You can't start a pile with a 2 or a set of 2s. Lead with something else. If 2s are all you have left, you can lead them."],
  ["table","Runs allowed","Straights of 3 or more cards may be played, and must be beaten by a higher straight of the same length.","You can play a straight of 3 or more ranks in a row, like 5-6-7. Suits don't matter. To beat it, play a higher straight of the same length, like 6-7-8."],
  ["table","Same suit","Play the same suit as the card below you and give out a sip.","If you play a single card of the same suit as the card it lands on, give one sip to anyone you like."],
  ["table","Illegal play","Play out of turn or play an illegal card and take 2 sips.","Playing out of turn, playing too low, or playing the wrong number of cards costs 2 sips. The cards go back into your hand."],
  ["table","No 2 finish","You can't go out on a 2. Try it and you drop to Asshole.","Your last card can't be a 2. Go out on a 2 anyway and you're the Asshole for the next round, no matter when you finished. Play your 2s earlier."],
  ["table","Complete it","If someone plays 3 of a rank, the holder of the 4th may jump in out of turn.","When three of the same rank are on the pile, whoever holds the fourth can slam it down right away, even out of turn. That completes the set, clears the pile, and they lead next."],
  ["table","Leftovers","When the round ends, the last player sips once for each card left.","When the round ends, the last player still holding cards, the new Asshole, sips once for every card left in their hand."],
  ["table","Speed round","Everyone plays as fast as possible. Hesitate and sip.","Play as fast as you can: no thinking out loud, no rearranging your hand. Anyone can call out a hesitation, and the slowpoke sips."],
  ["table","Face down","The next pile is played face down. Anyone can call “liar.” Wrong guesses sip.","For the next pile, play your cards face down and say what they are. You can bluff. Anyone can call “liar” and flip them: a caught bluffer sips, and a wrong accuser sips."],
  ["table","Pass it on","Before the round, everyone passes one card to the left.","Next round, after the deal and the card swap, everyone picks one card and passes it face down to the player on their left, all at the same time."],

// ---------- state ----------
const RANKS = {
  pa:{ pres:"President", vp:"Vice President", cit:"Citizen", va:"Vice Asshole", ass:"Asshole", title:"Presidents & Assholes" },
  vi:{ pres:"President", vp:"Vice President", cit:"Citizen", va:"Vice Idiot", ass:"Village Idiot", title:"Village Idiot" },
};
const RANK_ICON = { pres:"👑", vp:"🎖️", cit:"🙂", va:"🫠", ass:"🚽" };

let state = load(KEY) || { phase:"setup", count:5, names:["","","","","","","","","",""], style:"pa", clearOnNew:false, players:[], rounds:[], laws:[], tab:"game" };
let prefs = load(PREFS) || { favs:{}, custom:[], mode:"boost", cat:"all", q:"", onlyFav:false };
let entry = null, drawn = null, lastDraws = [], howOpen = new Set(), picker = null;
let confirmKey = null, confirmTimer = null;

function load(k){ try{ const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function savePrefs(){ try{ localStorage.setItem(PREFS, JSON.stringify(prefs)); }catch(e){} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural = (n, w) => `${n} ${w}${n===1?"":"s"}`;
const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g,"-");
const R = () => RANKS[state.style] || RANKS.pa;
const N = i => esc(state.players[i]);

function allRules(){
  return RULES.map(([c,t,d,x]) => ({ id:slug(t), c, t, d, x })).concat(prefs.custom.map(r => ({ ...r, custom:true })));
}
function ruleById(id){ return allRules().find(r => r.id === id); }

function rankKey(pos, n){
  if (pos === 0) return "pres";
  if (pos === n-1) return "ass";
  if (n >= 4 && pos === 1) return "vp";
  if (n >= 5 && pos === n-2) return "va";
  return "cit";
}
const lastRound = () => state.rounds[state.rounds.length-1];
function currentRanks(){ // player index -> rank key, from the last round
  const r = lastRound(); if (!r) return null;
  const m = {}; r.order.forEach((p,pos)=> m[p] = rankKey(pos, r.order.length)); return m;
}
function presidentNow(){ const r = lastRound(); return r ? r.order[0] : null; }

function confirmThen(key, fn){
  if (confirmKey === key){ clearTimeout(confirmTimer); confirmKey = null; fn(); return; }
  confirmKey = key; render();
  clearTimeout(confirmTimer);
  confirmTimer = setTimeout(()=>{ confirmKey = null; render(); }, 3500);
}
let wakeLock = null;
async function keepAwake(){
  try{ if (state.phase === "play" && "wakeLock" in navigator && document.visibilityState === "visible" && !wakeLock){
    wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
  }}catch(e){ wakeLock = null; }
}
document.addEventListener("visibilitychange", keepAwake);

// ---------- drawing ----------
function pool(){
  let list = allRules();
  if (prefs.cat !== "all") list = list.filter(r => r.c === prefs.cat);
  const active = new Set(state.laws.map(l => l.id));
  const fresh = list.filter(r => !active.has(r.id) && !lastDraws.includes(r.id));
  if (fresh.length) list = fresh;
  if (prefs.mode === "favs"){ const f = list.filter(r => prefs.favs[r.id]); return f.map(r=>[r,1]); }
  return list.map(r => [r, prefs.mode === "boost" && prefs.favs[r.id] ? 4 : 1]);
}
function drawRule(){
  const p = pool();
  if (!p.length){ drawn = { empty:true }; return; }
  const total = p.reduce((a,[,w])=>a+w,0);
  let x = Math.random() * total;
  for (const [r,w] of p){ x -= w; if (x <= 0){ drawn = r; break; } }
  if (!drawn || drawn.empty) drawn = p[p.length-1][0];
  lastDraws.push(drawn.id); if (lastDraws.length > 12) lastDraws.shift();
}
function enact(id, random){
  if (state.laws.some(l => l.id === id)) return;
  const p = presidentNow();
  state.laws.push({ id, round: state.rounds.length, by: p, random: !!random });
  (state.lawLog = state.lawLog || []).push({ id, round: state.rounds.length, by: p, random: !!random });
  stopClock();
  save();
}
function pickForMe(){
  drawRule();
  if (drawn && !drawn.empty){ enact(drawn.id, true); drawn = { ...drawn, auto:true }; }
}
// 30-second decision clock
let clock = null;
function stopClock(){ if (clock){ clearInterval(clock.t); clock = null; } }
function startClock(){
  stopClock();
  clock = { left:30, t:setInterval(() => {
    clock.left--;
    const el = document.getElementById("clockNum"); if (el) el.textContent = clock.left;
    if (clock.left <= 0){ stopClock(); picker = null; pickForMe(); render(); }
  }, 1000) };
}

// ---------- views ----------
function render(){
  const app = document.getElementById("app");
  const focusId = document.activeElement && document.activeElement.id;
  const y = window.scrollY;
  const tab = state.phase === "setup" && state.tab === "game" ? "setup" : state.tab;
  app.innerHTML = topBar() + (tab === "setup" ? setupView() : tab === "game" ? gameView() : tab === "rules" ? rulesView() : guideView()) + (picker ? pickerView() : "");
  document.body.style.overflow = picker ? "hidden" : "";
  if (focusId){ const el = document.getElementById(focusId); if (el) el.focus({preventScroll:true}); }
  window.scrollTo(0, y);
}
function topBar(){
  const tabs = [["game","Game"],["rules","Rule deck"],["guide","How to play"]];
  return `<div class="top"><div class="brand">${CROWN}<h1 class="grow">${esc(R().title)}</h1>${hx.button()}</div>
    <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab" role="tab" id="tab-${k}" data-act="tab" data-v="${k}" aria-selected="${state.tab===k}">${l}</button>`).join("")}</div></div>`;
}

function setupView(){
  return `
  <div class="panel">
    <div class="eyebrow">Players</div>
    <div class="stepper">
      <button id="minus" data-act="count" data-d="-1" aria-label="Fewer players" ${state.count<=3?"disabled":""}>−</button>
      <span class="count num">${state.count}</span>
      <button id="plus" data-act="count" data-d="1" aria-label="More players" ${state.count>=10?"disabled":""}>+</button>
      <p class="hint grow">3 to 10 players. 4 to 7 plays best.</p>
    </div>
    <div class="names">${Array.from({length:state.count},(_,i)=>`<input type="text" id="name-${i}" data-name="${i}" placeholder="Player ${i+1}" value="${esc(state.names[i]||"")}" maxlength="16" autocomplete="off" aria-label="Player ${i+1}">`).join("")}</div>
  </div>
  <div class="panel">
    <div class="eyebrow">House style</div>
    <div class="chips">
      <button class="chip" id="style-pa" data-act="style" data-v="pa" aria-pressed="${state.style==="pa"}">Presidents &amp; Assholes</button>
      <button class="chip" id="style-vi" data-act="style" data-v="vi" aria-pressed="${state.style==="vi"}">Village Idiot</button>
    </div>
    <div class="toggle"><span class="tl">New President, new laws<span class="ts">Clear all rules when someone else takes office</span></span>
      <button class="switch" role="switch" id="sw-clear" data-act="clearRule" aria-checked="${state.clearOnNew}" aria-label="Clear rules for a new President"></button></div>
  </div>
  <button class="primary" data-act="start" id="start">Start the game</button>
  <p class="hint">First time? Check the How to play tab. The rule deck works any time, even without starting a game.</p>`;
}

function gameView(){
  if (state.over) return overView();
  const n = state.rounds.length, rk = currentRanks(), np = state.players.length;
  let cabinet;
  if (!rk){
    cabinet = `<div class="panel"><h2>No President yet</h2><p class="hint">Deal the whole deck. Whoever has the 3 of clubs leads. The first player out becomes President.</p></div>`;
  } else {
    const order = lastRound().order;
    const seats = order.map((p,pos) => { const k = rankKey(pos, np);
      return `<div class="seat ${k}"><span class="ico" aria-hidden="true">${RANK_ICON[k]}</span><span class="nm">${N(p)}</span><span class="rk">${R()[k]}</span></div>`; }).join("");
    const pres = order[0], ass = order[np-1];
    const swapLines = [`<span><b>${N(ass)}</b> gives ${N(pres)} their 2 best cards. ${N(pres)} gives back any 2.</span>`];
    if (np >= 5) swapLines.push(`<span><b>${N(order[np-2])}</b> gives ${N(order[1])} their best card. ${N(order[1])} gives back any 1.</span>`);
    cabinet = `<div class="panel"><div class="row"><h2 class="grow">The cabinet</h2><span class="hint">after round ${n}</span></div>
      <div class="cabinet">${seats}</div>
      <div class="swap"><span class="eyebrow" style="color:var(--gold)">Before round ${n+1}: card swap</span>${swapLines.join("")}
      <span class="hint">${N(ass)} deals. Reseat in this order if you move seats by rank.</span></div></div>`;
  }

  const drawBox = `<div class="panel"><div class="row"><h2 class="grow">${rk?`${N(presidentNow())}, make a rule`:"Make a rule"}</h2></div>
    ${drawnCard()}
    <div class="btnrow"><button class="primary" data-act="draw" id="drawGame">${drawn?"Draw another":"Draw a rule"}</button><button data-act="pkOpen" id="pickGame">📖 Choose a rule</button></div>
    ${decideRow()}
    <p class="hint">${drawModeText()} <a href="#" data-act="tab" data-v="rules" style="color:var(--gold)">Browse the deck</a></p></div>`;

  const laws = state.laws.length ? `<div class="panel"><div class="row"><h2 class="grow">Rules in effect</h2><button class="small ghost" data-act="clearLaws" id="clearLaws">${confirmKey==="clearLaws"?"Tap to confirm":"Clear all"}</button></div>
    <div class="active">${state.laws.map((l,i) => { const r = ruleById(l.id); if (!r) return "";
      return `<div class="law"><span class="lt">${esc(r.t)}</span><span class="ld">${esc(r.d)}</span>${how(r, "law")}
        <span class="lm">${l.by!=null?`Enacted by ${N(l.by)}`:"Enacted"}${l.round?` · round ${l.round}`:" · before round 1"}</span>
        <button class="small" id="repeal-${i}" data-act="repeal" data-i="${i}">Repeal</button></div>`; }).join("")}</div></div>` : "";

  const roundBtn = entry ? entryView() : `<div class="btnrow"><button class="primary" data-act="newRound" id="newRound">Record round ${n+1} results</button>${n ? `<button class="endbtn" data-act="endgame" id="endgame">${confirmKey==="end"?"Tap to end":"🏁 End game"}</button>` : ""}</div>`;

  let history = "";
  if (n){
    history = `<div class="panel"><div class="row"><h2 class="grow">Rounds</h2><button class="small" data-act="undo" id="undo">${confirmKey==="undo"?"Tap to confirm":"Undo last"}</button></div>
      <div>${state.rounds.map((r,ri)=>`<div class="hrow"><button class="small" id="edit-${ri}" data-act="edit" data-i="${ri}">${ri+1}</button>
        <span class="o"><b>👑 ${N(r.order[0])}</b> · ${r.order.slice(1,-1).map(N).join(" · ")} · <i>${N(r.order[r.order.length-1])}</i></span></div>`).reverse().join("")}</div>
      <p class="hint">Newest first. Tap a round to fix the order.</p></div>`;
  }
  history += statsView();
  const reset = n ? `<div class="btnrow">${hx.shareButton("Share standings", "small ghost")}<button class="small ghost" data-act="endgame" id="endgame2">${confirmKey==="end"?"Tap again to end the game":"🏁 End game"}</button></div>`
    : `<div class="btnrow"><button class="small ghost" data-act="newgame" id="newgame">${confirmKey==="new"?"Tap to confirm":"Change players"}</button></div>`;
  return cabinet + roundBtn + drawBox + laws + history + reset;
}

// After End game: who won (most times President, as in the stats), saved in History, and what's next
function overView(){
  const n = state.rounds.length, P = state.players.map((_, i) => i), r = R();
  const t = P.map(i => state.rounds.filter(x => x.order[0] === i).length), best = Math.max(...t), win = P.filter(i => t[i] === best);
  const rest = P.filter(i => !win.includes(i)).sort((a, b) => t[b] - t[a] || a - b);
  const times = k => k === 1 ? "once" : `${k} times`;
  return `<div class="panel gameover"><span class="eyebrow">Game over · ${plural(n, "round")}</span>
    <h2>${win.length > 1 ? `Tie: ${win.map(N).join(" &amp; ")}` : `${N(win[0])} wins`}</h2>
    <p>${r.pres} ${times(best)}${win.length > 1 ? " each" : ", more than anyone"}.</p>
    ${rest.length ? `<div class="num">${rest.map(i => `${N(i)} ${t[i]}`).join(" · ")}</div>` : ""}
    ${hx.saved()}
    <div class="btnrow"><button data-act="rematch" id="rematch">Rematch, same players</button><button data-act="newsetup" id="newsetup">New players</button></div>
    <button class="small ghost" data-act="unend" id="unend">Oops, keep playing</button></div>` + statsView();
}

function drawModeText(){
  const favCount = Object.keys(prefs.favs).filter(k=>prefs.favs[k]).length;
  const cat = prefs.cat === "all" ? "the whole deck" : `“${CATS[prefs.cat]}”`;
  if (prefs.mode === "favs") return `Drawing only from your ${plural(favCount,"favorite")} in ${cat}.`;
  if (prefs.mode === "boost") return favCount ? `Drawing from ${cat}. Your ${plural(favCount,"favorite")} come up 4× as often.` : `Drawing from ${cat}. Star rules you like and they'll come up 4× as often.`;
  return `Drawing evenly from ${cat}.`;
}
function drawnCard(){
  if (!drawn) return "";
  if (drawn.empty) return `<div class="err">No rules match. Add some favorites or switch the draw to the whole deck.</div>`;
  const on = state.laws.some(l => l.id === drawn.id), fav = !!prefs.favs[drawn.id];
  return `<div class="drawn" aria-live="polite"><span class="cat">${drawn.auto?"Chosen for the President · ":drawn.picked?"Picked from the deck · ":""}${CATS[drawn.c]||"Custom"}${drawn.custom?" · house rule":""}</span>
    <span class="rt">${esc(drawn.t)}</span><span class="rd">${esc(drawn.d)}</span>${drawn.x?`<span class="rx"><b>How it works:</b> ${esc(drawn.x)}</span>`:""}
    <div class="btnrow"><button class="go" data-act="enact" data-id="${drawn.id}" id="enactDrawn" ${on?"disabled":""}>${on?"In effect":"Enact it"}</button>
    <button data-act="fav" data-id="${drawn.id}" id="favDrawn" aria-pressed="${fav}">${fav?"★ Favorited":"☆ Favorite"}</button></div></div>`;
}

function decideRow(){
  return `<div class="btnrow">
    <button data-act="pickForMe" id="pickForMe">🎲 Pick for me</button>
    <button data-act="clock" id="clockBtn" aria-pressed="${!!clock}">${clock?`⏱ <span id="clockNum" class="num">${clock.left}</span>s · stop`:"⏱ 30-second clock"}</button>
  </div>
  <p class="hint">Pick for me enacts a random rule right away. The clock gives the President 30 seconds, then picks for them.</p>`;
}

function entryView(){
  const idx = entry.editing != null ? entry.editing : state.rounds.length;
  const np = state.players.length;
  const chips = state.players.map((p,i) => { const pos = entry.order.indexOf(i);
    return `<button class="oc ${pos>=0?"picked":""}" id="oc-${i}" data-act="pick" data-i="${i}"><span class="badge num">${pos>=0?pos+1:""}</span>${N(i)}</button>`; }).join("");
  const done = entry.order.length === np;
  const preview = done ? `<div class="cabinet">${entry.order.map((p,pos)=>{const k = rankKey(pos,np); return `<div class="seat ${k}"><span class="ico">${RANK_ICON[k]}</span><span class="nm">${N(p)}</span><span class="rk">${R()[k]}</span></div>`;}).join("")}</div>` : "";
  return `<div class="panel">
    <div class="row"><h2 class="grow">${entry.editing!=null?"Fix round":"Round"} ${idx+1}</h2><button class="small ghost" data-act="cancel" id="cancel">Cancel</button></div>
    <p class="hint">Tap players in the order they went out. Tap again to take someone back. The last player fills in automatically.</p>
    <div class="orderchips">${chips}</div>
    ${preview}
    ${entry.error?`<div class="err">${esc(entry.error)}</div>`:""}
    <button class="primary" data-act="saveRound" id="saveRound" ${done?"":"disabled"}>${entry.editing!=null?"Save changes":"Swear in the new cabinet"}</button>
    ${entry.editing!=null?`<button class="danger" data-act="delRound" id="delRound">${confirmKey==="del"?"Tap again to delete this round":"Delete this round"}</button>`:""}
  </div>`;
}

function statsView(){
  const n = state.rounds.length, np = state.players.length, z = () => Array(np).fill(0);
  const log = state.lawLog || [];
  if (!n && !log.length) return `<div class="panel"><h2>Stats</h2><p class="hint">Stats show up here after the first round: who's held office longest, who keeps hitting rock bottom, who makes the most rules, and who can't make up their mind.</p></div>`;
  const pres = z(), vp = z(), ass = z(), posSum = z(), comeback = z(), made = z(), rnd = z();
  let streak = {len:0, who:[]}, cur = {p:null, len:0}, rise = {v:0, list:[]}, fall = {v:0, list:[]};
  state.rounds.forEach((r,ri) => {
    r.order.forEach((p,pos) => { const k = rankKey(pos,np); posSum[p] += pos+1; if (k==="pres") pres[p]++; if (k==="vp") vp[p]++; if (k==="ass") ass[p]++; });
    const P0 = r.order[0];
    if (ri > 0){
      const prev = state.rounds[ri-1].order;
      if (prev[prev.length-1] === P0) comeback[P0]++;
      r.order.forEach((p,pos) => { const d = prev.indexOf(p) - pos;
        if (d > rise.v) rise = {v:d, list:[[p,ri]]}; else if (d > 0 && d === rise.v) rise.list.push([p,ri]);
        if (-d > fall.v) fall = {v:-d, list:[[p,ri]]}; else if (d < 0 && -d === fall.v) fall.list.push([p,ri]); });
    }
    if (P0 === cur.p) cur.len++; else cur = {p:P0, len:1};
    if (cur.len > streak.len) streak = {len:cur.len, who:[cur.p]}; else if (cur.len === streak.len && !streak.who.includes(cur.p)) streak.who.push(cur.p);
  });
  const catCount = {};
  log.forEach(l => { if (l.by != null){ made[l.by]++; if (l.random) rnd[l.by]++; } const r = ruleById(l.id); if (r) catCount[r.c] = (catCount[r.c]||0) + 1; });
  const top = arr => { const m = Math.max(...arr); return { m, who: arr.map((v,i)=>i).filter(i=>arr[i]===m) }; };
  const nm = idx => [...new Set(idx)].map(N).join(", ");
  const aw = (a,b,c) => `<div class="aw"><span class="an">${a}</span><span class="ah">${b}</span><span class="ad">${c}</span></div>`;
  const tp = top(pres), ta = top(ass), cb = top(comeback), lm = top(made), ind = top(rnd);
  const favCat = Object.entries(catCount).sort((a,b)=>b[1]-a[1])[0];
  const cards = [];
  if (n){
    cards.push(aw("Commander in chief", nm(tp.who), `President ${plural(tp.m,"time")}`));
    cards.push(aw("Dynasty", nm(streak.who), `${plural(streak.len,"round")} in a row as President`));
    cards.push(aw("Rock bottom", nm(ta.who), `${R().ass} ${plural(ta.m,"time")}`));
    cards.push(aw("Rags to riches", cb.m?nm(cb.who):"Nobody yet", cb.m?`${R().ass} to President ${plural(cb.m,"time")}`:`Nobody's gone from ${R().ass} to President yet`));
    cards.push(aw("Elevator", rise.v?nm(rise.list.map(x=>x[0])):"Nobody yet", rise.v?`Jumped ${plural(rise.v,"spot")} in round ${[...new Set(rise.list.map(x=>x[1]+1))].join(", ")}`:"Nobody's climbed yet"));
    cards.push(aw("Free fall", fall.v?nm(fall.list.map(x=>x[0])):"Nobody yet", fall.v?`Dropped ${plural(fall.v,"spot")} in round ${[...new Set(fall.list.map(x=>x[1]+1))].join(", ")}`:"Nobody's slipped yet"));
  }
  cards.push(aw("Lawmaker", lm.m?nm(lm.who):"Nobody yet", lm.m?`Made ${plural(lm.m,"rule")}`:"No rules made yet"));
  cards.push(aw("Can't decide", ind.m?nm(ind.who):"Nobody yet", ind.m?`Let the app pick ${plural(ind.m,"time")}`:"Every President has picked their own"));
  const table = n ? `<div class="stwrap"><table class="st"><thead><tr><th>Player</th><th>👑</th><th>🎖️</th><th>🚽</th><th>Avg finish</th><th>Rules</th><th>🎲</th></tr></thead>
    <tbody>${state.players.map((p,i)=>`<tr><td>${N(i)}</td><td>${pres[i]}</td><td>${vp[i]}</td><td>${ass[i]}</td><td>${(posSum[i]/n).toFixed(1)}</td><td>${made[i]}</td><td>${rnd[i]}</td></tr>`).join("")}</tbody></table></div>` : "";
  return `<div class="panel"><h2>Stats</h2><div class="hl">${cards.join("")}</div>${table}
    <p class="hint">${plural(n,"round")} played · ${plural(log.length,"rule")} enacted${log.filter(l=>l.random).length?` (${log.filter(l=>l.random).length} picked by the app)`:""}${favCat?` · most popular kind: ${CATS[favCat[0]]||"house rules"}`:""}. 🎲 counts rules the app picked.</p></div>`;
}

// Choosing a rule from the deck: a full-screen list over the game, with search, categories and favorites first.
// Enact puts the rule in effect for the current President and shows it on the gold card.
function pickerView(){
  const favs = allRules().filter(r => prefs.favs[r.id]).length, custom = prefs.custom.length;
  const cats = [["all","All"], ...(favs ? [["fav","★ Favorites"]] : []), ...Object.entries(CATS), ...(custom ? [["custom","House rules"]] : [])];
  const pres = presidentNow();
  return `<div class="sheet" role="dialog" aria-modal="true" aria-label="Choose a rule"><div class="sin">
    <div class="shead"><div class="grow"><h2>Choose a rule</h2><span class="hint">${pres != null ? `${esc(N(pres))} picks. ` : ""}Tap Enact to put it in effect.</span></div><button class="small ghost" data-act="pkClose" id="pkClose">Close</button></div>
    <input type="search" id="pkq" placeholder="Search rules" value="${esc(picker.q)}" autocomplete="off" aria-label="Search rules">
    <div class="chips pkcats" role="group" aria-label="Category">${cats.map(([k,l]) => `<button class="chip" data-act="pkCat" data-v="${k}" id="pkc-${k}" aria-pressed="${picker.cat===k}">${l}</button>`).join("")}</div>
    <div class="rlist" id="pklist">${pickerList()}</div></div></div>`;
}
function pickerList(){
  const q = picker.q.trim().toLowerCase(), active = new Set(state.laws.map(l => l.id));
  let list = allRules();
  if (picker.cat === "fav") list = list.filter(r => prefs.favs[r.id]);
  else if (picker.cat === "custom") list = list.filter(r => r.custom);
  else if (picker.cat !== "all") list = list.filter(r => r.c === picker.cat);
  if (q) list = list.filter(r => (r.t+" "+r.d+" "+(r.x||"")).toLowerCase().includes(q));
  if (!list.length) return `<p class="hint" style="padding:12px 0">No rules match.</p>`;
  const item = r => `<div class="ritem pk">
    <div><div class="c">${prefs.favs[r.id] ? "★ " : ""}${CATS[r.c]||""}${r.custom?" · house rule":""}</div><div class="t">${esc(r.t)}</div><div class="d">${esc(r.d)}</div>${how(r, "pick")}</div>
    <button class="en" data-act="pkEnact" data-id="${r.id}" id="pk-${r.id}" ${active.has(r.id)?`disabled aria-pressed="true">In effect`:`>Enact`}</button></div>`;
  // with no search or category, favorites come first
  const favs = !q && picker.cat === "all" ? list.filter(r => prefs.favs[r.id]) : [];
  if (!favs.length) return list.map(item).join("");
  return `<h3 class="pkh">★ Your favorites</h3>${favs.map(item).join("")}<h3 class="pkh">All rules</h3>${list.filter(r => !prefs.favs[r.id]).map(item).join("")}`;
}
// "How it works" under a rule, folded; which ones are open survives the re-render after every tap
function how(r, where){
  if (!r.x) return "";
  const k = where + ":" + r.id;
  return `<details class="how" data-how="${esc(k)}" ${howOpen.has(k)?"open":""}><summary>How it works</summary><p>${esc(r.x)}</p></details>`;
}
function ruleList(){
  const q = prefs.q.trim().toLowerCase(), active = new Set(state.laws.map(l=>l.id));
  let list = allRules();
  if (prefs.cat === "custom") list = list.filter(r=>r.custom); else if (prefs.cat !== "all") list = list.filter(r=>r.c===prefs.cat);
  if (prefs.onlyFav) list = list.filter(r=>prefs.favs[r.id]);
  if (q) list = list.filter(r => (r.t+" "+r.d+" "+(r.x||"")).toLowerCase().includes(q));
  if (!list.length) return `<p class="hint" style="padding:12px 0">No rules match.</p>`;
  return list.map(r => `<div class="ritem">
    <button class="star" data-act="fav" data-id="${r.id}" id="star-${r.id}" aria-pressed="${!!prefs.favs[r.id]}" aria-label="Favorite ${esc(r.t)}">${prefs.favs[r.id]?"★":"☆"}</button>
    <div><div class="c">${CATS[r.c]||""}${r.custom?" · house rule":""}</div><div class="t">${esc(r.t)}</div><div class="d">${esc(r.d)}</div>${how(r, "deck")}</div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
      <button class="en" data-act="${active.has(r.id)?"repealId":"enact"}" data-id="${r.id}" id="en-${r.id}" aria-pressed="${active.has(r.id)}">${active.has(r.id)?"In effect":"Enact"}</button>
      ${r.custom?`<button class="small ghost" data-act="delCustom" data-id="${r.id}" id="del-${r.id}" style="font-size:12px">${confirmKey==="dc-"+r.id?"Confirm":"Delete"}</button>`:""}
    </div></div>`).join("");
}

function guideView(){
  const r = R();
  return `<div class="panel guide">
    <section><h2>The goal</h2>
      <p>Get rid of all your cards first. The order you go out sets the pecking order for the next round: first out is ${r.pres}, last out is ${r.ass}. The ${r.pres} makes the rules. The ${r.ass} does the dishes, figuratively and possibly literally.</p></section>
    <section><h3>Setup</h3>
      <ul><li>One standard 52-card deck for up to 6 players. Shuffle two decks together for 7 or more.</li>
      <li>Deal out the whole deck. Uneven hands are fine.</li>
      <li>In the first round, whoever has the 3♣ leads, and must play it.</li></ul></section>
    <section><h3>Card order, low to high</h3>
      <div class="ranks"><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>J</span><span>Q</span><span>K</span><span>A</span><span class="hi">2</span></div>
      <p>2s are the highest card. Suits don't matter.</p></section>
    <section><h3>Playing a turn</h3>
      <ol><li>The leader plays a single card, a pair, three of a kind, or four of a kind.</li>
      <li>Going around, each player must play the same number of cards at a higher rank. Two 9s can only be beaten by two 10s or better.</li>
      <li>If you can't or don't want to play, say “pass.” Passing doesn't take you out for the rest of the pile. You can play next time around.</li>
      <li>When everyone passes in a row, the last player who played clears the pile and leads the next one with anything they want.</li>
      <li>A 2 (or matching count of 2s) clears the pile right away, and that player leads again.</li></ol></section>
    <section><h3>Going out and ranks</h3>
      <dl class="rtable">
        <dt>1st out</dt><dd>${r.pres}. Makes rules, gets the best cards.</dd>
        <dt>2nd out</dt><dd>${r.vp} (4+ players).</dd>
        <dt>Middle</dt><dd>${r.cit}s. Safe, for now.</dd>
        <dt>2nd to last</dt><dd>${r.va} (5+ players).</dd>
        <dt>Last</dt><dd>${r.ass}. Deals next round and serves the ${r.pres}.</dd>
      </dl>
      <p>Keep playing until only one player has cards left. That player is the ${r.ass}.</p></section>
    <section><h3>The card swap</h3>
      <ul><li>Before each new round, the ${r.ass} hands the ${r.pres} their 2 best cards. The ${r.pres} gives back any 2 cards they don't want.</li>
      <li>With 5 or more players, the ${r.va} gives the ${r.vp} their 1 best card, and gets 1 back.</li>
      <li>The ${r.pres} leads the first pile.</li></ul></section>
    <section><h3>Seating</h3>
      <p>Many groups reseat by rank each round, with the ${r.pres} in the best chair and the ${r.ass} in the worst. The Game tab lists the new order after every round.</p></section>
    <section><h3>The drinking part</h3>
      <ul><li><b>Pass, sip.</b> Every time you pass, take a sip.</li>
      <li><b>Skipped, sip.</b> If a pair of the same rank is played right after yours and skips you, sip.</li>
      <li><b>Cleared by a 2.</b> Everyone who didn't play a 2 sips.</li>
      <li><b>Rank tax.</b> The ${r.pres} can make anyone below them sip once per round. The ${r.ass} sips whenever the ${r.pres} sips.</li>
      <li><b>Rules.</b> At the start of each round, the ${r.pres} enacts one rule. Use the Draw button or pick from the deck. Rules stay in effect until repealed${state.clearOnNew?" or a new " + r.pres + " takes over":""}. Break a rule, take a sip.</li></ul></section>
    <section><h3>Common variations</h3>
      <ul><li><b>Revolution.</b> Four of a kind flips the card order until the pile clears.</li>
      <li><b>Bomb.</b> Four of a kind clears the pile no matter what.</li>
      <li><b>Same-rank skip.</b> Playing the same rank as the card before skips the next player.</li>
      <li><b>Jokers.</b> Add two jokers as the highest cards, above 2s.</li>
      <li><b>No finishing on a 2.</b> Going out on a 2 drops you straight to ${r.ass}.</li>
      <li><b>Runs.</b> Allow straights of 3 or more, beaten by a higher straight of the same length.</li></ul></section>
    <section><h3>House guidelines</h3>
      <ul><li>Sips, not chugs. The game lasts longer and so does everyone.</li>
      <li>Water always counts. Anyone can switch at any time, no questions asked.</li>
      <li>Rules are for laughs. Skip anything that makes someone uncomfortable.</li>
      <li>Nobody drives home. Plan the ride before the first deal.</li></ul></section>
  </div>`;
}

document.addEventListener("click", e => {

    case "count": state.count = Math.min(10, Math.max(3, state.count + +b.dataset.d)); save(); render(); break;
    case "style": state.style = b.dataset.v; save(); render(); break;
    case "clearRule": state.clearOnNew = !state.clearOnNew; save(); render(); break;
    case "start":
      state.players = Array.from({length:state.count},(_,i)=> (state.names[i]||"").trim() || `Player ${i+1}`);
      state.rounds = []; state.laws = []; state.lawLog = []; state.phase = "play"; state.over = false; entry = null; drawn = null; stopClock(); save(); render(); keepAwake(); break;
    case "newRound": entry = { editing:null, order:[], error:"" }; render(); break;
    case "edit": entry = { editing:+b.dataset.i, order:[...state.rounds[+b.dataset.i].order], error:"" }; render(); document.getElementById("cancel")?.scrollIntoView({block:"start"}); break;
    case "cancel": entry = null; render(); break;
    case "pick": {
      const i = +b.dataset.i, pos = entry.order.indexOf(i), np = state.players.length;
      if (pos >= 0) entry.order.splice(pos); // take back this pick and everything after
      else { entry.order.push(i); if (entry.order.length === np-1){ const last = state.players.findIndex((_,j)=>!entry.order.includes(j)); entry.order.push(last); } }
      render(); break;
    }
    case "saveRound": {
      const prevPres = presidentNow();
      if (entry.editing != null) state.rounds[entry.editing] = { order:[...entry.order] };
      else state.rounds.push({ order:[...entry.order] });
      if (state.clearOnNew && entry.editing == null && prevPres != null && prevPres !== entry.order[0]) state.laws = [];
      entry = null; drawn = null; save(); render(); window.scrollTo({top:0, behavior:"smooth"}); break;
    }
    case "delRound": confirmThen("del", ()=>{ state.rounds.splice(entry.editing,1); entry = null; save(); render(); }); break;
    case "undo": confirmThen("undo", ()=>{ state.rounds.pop(); entry = null; save(); render(); }); break;
    case "endgame": confirmThen("end", () => { state.over = true; entry = null; drawn = null; picker = null; stopClock(); save(); render(); window.scrollTo(0, 0); }); break;
    case "unend": state.over = false; save(); render(); break;
    case "rematch": stopClock(); state.over = false; state.rounds = []; state.laws = []; state.lawLog = []; entry = null; drawn = null; save(); render(); window.scrollTo(0, 0); break;
    case "newsetup": stopClock(); state.over = false; state.phase = "setup"; state.rounds = []; state.laws = []; state.lawLog = []; entry = null; drawn = null; state.tab = "game"; save(); render(); window.scrollTo(0, 0); break;
    case "newgame": confirmThen("new", ()=>{ stopClock(); state.phase = "setup"; state.rounds = []; state.laws = []; state.lawLog = []; entry = null; drawn = null; state.tab = "game"; save(); render(); }); break;
    case "draw": drawRule(); render(); break;
    case "pickForMe": pickForMe(); render(); break;
    case "clock": if (clock) stopClock(); else startClock(); render(); break;
    case "enact": enact(b.dataset.id); render(); break;
    case "pkOpen": picker = { q:"", cat:"all" }; render(); break;
    case "pkClose": picker = null; render(); break;
    case "pkCat": picker.cat = b.dataset.v; render(); { const l = document.querySelector(".sheet"); if (l) l.scrollTop = 0; } break;
    case "pkEnact": { const r = ruleById(b.dataset.id); if (!r) break; enact(r.id); drawn = { ...r, picked:true }; picker = null; render();
      const card = document.querySelector(".drawn"); if (card) card.scrollIntoView({ block:"center" }); break; }
    case "repeal": state.laws.splice(+b.dataset.i,1); save(); render(); break;
    case "repealId": state.laws = state.laws.filter(l=>l.id!==b.dataset.id); save(); render(); break;
    case "clearLaws": confirmThen("clearLaws", ()=>{ state.laws = []; save(); render(); }); break;

    case "mode": prefs.mode = b.dataset.v; savePrefs(); render(); break;

// History adapter: how a Presidents & Assholes game looks to the shared history module.
// The app keeps no points and has no game over. Each round records the order players went out; first out is
// President (the app's rankKey). A round scores 1 for its President, so a game's total is how many times each
// player was President: the app's 👑 column and its "Commander in chief" award, so the most wins.
// A game runs until someone taps End game (or New players), which finishes it; until then it's In progress.
const HX = {
  app: "presidents", title: "Presidents", unit: ["round", "rounds"], sideWord: "player", lowWins: false,
  guest: n => /^player \d+$/i.test(String(n).trim()),
  current(){
    const P = state.players || [], R = state.rounds || [];
    if (state.phase !== "play" || !P.length || !R.length) return null;
    const np = P.length, deck = allRules(), title = id => { const r = deck.find(x => x.id === id); return r ? r.t : "A deleted house rule"; };
    const rounds = R.map(r => P.map((_,i) => rankKey(r.order.indexOf(i), np) === "pres" ? 1 : 0)), t = P.map((_,i) => rounds.reduce((a,r) => a + r[i], 0)), best = Math.max(...t);
    return {
      sides: P.map(p => ({ name: p, players: [p] })),
      rounds,
      done: !!state.over, winners: state.over ? P.map((_,i) => i).filter(i => t[i] === best) : undefined,
      note: (state.style === "vi" ? "Village Idiot · " : "") + "score = times President",
      extra: {
        style: state.style === "vi" ? "vi" : "pa",
        order: R.map(r => r.order.slice()),
        laws: (state.lawLog || []).map(l => ({ t: title(l.id), by: l.by == null ? null : l.by, round: l.round || 0, random: !!l.random }))
      }
    };
  },
  // Tells the module the game ended because New game was tapped (not undone to nothing): it is then finished, most Presidents wins.
  ended(){ return state.phase === "setup"; },
  detail(g){
    const x = g.extra; if (!x || !Array.isArray(x.order)) return "";
    const rk = RANKS[x.style] || RANKS.pa, n = g.sides.length;
    const nm = i => esc(g.sides[i] ? g.sides[i].name : `Player ${i+1}`), nb = s => s.replace(/ /g, "&nbsp;");
    const rounds = x.order.map((o,k) => `Round ${k+1}: ` + o.map((p,pos) => { const r = rankKey(pos, n); return nb((r === "pres" ? "👑 " : r === "ass" ? "🚽 " : "") + nm(p)); }).join(" · "));
    const ass = g.sides.map((_,i) => x.order.filter(o => rankKey(o.indexOf(i), n) === "ass").length);
    const low = ass.map((c,i) => [c,i]).filter(([c]) => c).sort((a,b) => b[0] - a[0] || a[1] - b[1]).map(([c,i]) => nb(`${nm(i)} ${c}`));
    const laws = (x.laws || []).map(l => `${esc(l.t)} (${[l.by != null ? nm(l.by) : "", l.round ? `round ${l.round}` : "before round 1", l.random ? "app's pick" : ""].filter(Boolean).join(", ")})`);
    return `<p class="hint">${rounds.join("<br>")}</p>`
      + (low.length ? `<p class="hint">Times ${esc(rk.ass)}: ${low.join(" · ")}</p>` : "")
      + `<p class="hint">${laws.length ? `Rules made: ${laws.join(" · ")}` : "No rules made."}</p>`;
  },
  records(done){
    const rows = [];
    done.forEach(g => {
      const x = g.extra; if (!x || !Array.isArray(x.order)) return;
      const n = g.sides.length;
      g.sides.forEach((s,i) => {
        let run = 0, dyn = 0;
        x.order.forEach(o => { if (rankKey(o.indexOf(i), n) === "pres"){ run++; dyn = Math.max(dyn, run); } else run = 0; });
        rows.push({ g, who: s.players[0] || s.name, rk: RANKS[x.style] || RANKS.pa, dyn,
          ass: x.order.filter(o => rankKey(o.indexOf(i), n) === "ass").length, laws: (x.laws || []).filter(l => l.by === i).length });
      });
    });
    if (!rows.length) return [];
    const top = f => { const m = Math.max(...rows.map(r => r[f])); return { m, who: rows.filter(r => r[f] === m) }; };
    const names = w => [...new Set(w.map(r => r.who))].slice(0,3).join(", ");
    const when = w => w.length === 1 ? new Date(w[0].g.date).toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" }) : `${w.length} times`;
    const d = top("dyn"), a = top("ass"), l = top("laws"), out = [];
    if (d.m > 1) out.push(["Dynasty", names(d.who), `President ${d.m} rounds in a row · ${when(d.who)}`]);
    if (a.m) out.push(["Rock bottom", names(a.who), `${a.who[0].rk.ass} ${a.m} times in a game · ${when(a.who)}`]);
    if (l.m) out.push(["Lawmaker", names(l.who), `${l.m} rule${l.m === 1 ? "" : "s"} in a game · ${when(l.who)}`]);
    return out;
  }
};
/* ---------- game history (shared module, same in every score app) ----------
   Every game with at least one scored round is saved to localStorage as it's played, with its date,
   the teams or players, every round's scores, the final totals and the winner. A "History" screen shows
   all-time records by player name, a game log with full scorecards, and backup / restore.
   The app supplies an adapter, HX (defined just above), and this module wraps the app's save() and render(). */
const hx = (() => {
  const HKEY = HX.app + "-history-v1", BKEY = HX.app + "-last-backup";
  const unitOne = (HX.unit || ["round", "rounds"])[0], unitMany = (HX.unit || ["round", "rounds"])[1];
  const ui = { open: false, range: "all", sel: null, game: null, all: false, msg: "", confirm: null, timer: 0 };
  const e = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = n => (n < 0 ? "−" : "") + Math.abs(n).toLocaleString("en-US");
  const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + "s")}`;
  const pkey = n => String(n || "").trim().replace(/\s+/g, " ").toLowerCase();
  const guest = n => !pkey(n) || (HX.guest ? HX.guest(n) : /^(player|partner|team|side|seat) \d+$/i.test(String(n).trim()));
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const whenTxt = iso => { const d = new Date(iso); return isNaN(d) ? "Unknown date" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) + " · " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); };
  const dayTxt = iso => { const d = new Date(iso); return isNaN(d) ? "Unknown date" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); };

  // ----- storage -----
  const valid = g => !!g && typeof g.id === "string" && Array.isArray(g.sides) && g.sides.length >= 1 && g.sides.every(s => s && typeof s.name === "string" && Array.isArray(s.players))
    && Array.isArray(g.rounds) && g.rounds.every(r => Array.isArray(r) && r.length === g.sides.length && r.every(v => typeof v === "number" && isFinite(v)));
  function load() { try { const a = JSON.parse(localStorage.getItem(HKEY) || "[]"); return Array.isArray(a) ? a.filter(valid) : []; } catch (err) { return []; } }
  let games = load();
  function persist() { try { localStorage.setItem(HKEY, JSON.stringify(games)); } catch (err) { /* storage full or blocked */ } }
  const totalsOf = g => Array.isArray(g.totals) && g.totals.length === g.sides.length ? g.totals : g.sides.map((_, i) => g.rounds.reduce((s, r) => s + r[i], 0));
  function winnersOf(g) {
    if (Array.isArray(g.winners) && g.winners.length) return g.winners;
    const t = totalsOf(g), best = g.lowWins ? Math.min(...t) : Math.max(...t);

  function sync() {
    if (typeof state !== "object" || !state) return;

    const has = cur && Array.isArray(cur.rounds) && cur.rounds.length > 0;
    const k = state.hxId ? games.findIndex(g => g.id === state.hxId) : -1;
    if (has) {
      if (!state.hxId) state.hxId = newId();
      const prev = k >= 0 ? games[k] : null;
      const g = {
        id: state.hxId, date: prev ? prev.date : new Date().toISOString(), updated: new Date().toISOString(),
        sides: cur.sides.map(s => ({ name: String(s.name || ""), players: (s.players || []).map(String) })),
        rounds: cur.rounds.map(r => r.map(v => +v || 0)),
        totals: (cur.totals || null) && cur.totals.map(v => +v || 0),
        done: !!cur.done, winners: cur.done && Array.isArray(cur.winners) ? cur.winners.slice() : undefined,
        lowWins: !!(cur.lowWins != null ? cur.lowWins : HX.lowWins), note: cur.note || "", labels: cur.labels || undefined, extra: cur.extra || undefined
      };
      if (!g.totals) delete g.totals;
      const before = prev ? JSON.stringify(Object.assign({}, prev, { updated: 0 })) : "";
      if (before === JSON.stringify(Object.assign({}, g, { updated: 0 }))) return;
      if (k >= 0) games[k] = g; else games.push(g);

  const byDate = () => games.slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  function inRange(g) {
    if (ui.range === "all") return true;
    const d = new Date(g.date);
    if (isNaN(d)) return false;
    if (ui.range[0] === "y") return d.getFullYear() === +ui.range.slice(1);
    return Date.now() - d <= +ui.range.slice(1) * 864e5;

  const rangeLabel = () => ui.range === "all" ? "all time" : ui.range[0] === "y" ? ui.range.slice(1) : `the last ${ui.range.slice(1)} days`;
  function sideLabel(s) {
    const named = s.players.filter(p => !guest(p));
    if (s.players.length > 1) return guest(s.name) || !s.name ? (named.length ? s.players.join(" & ") : s.name || "Team") : `${s.name} (${s.players.join(" & ")})`;
    return s.players[0] || s.name;
  }
  function shortLabel(s) {
    if (s.players.length > 1) return guest(s.name) || !s.name ? s.players.join(" & ") : s.name;
    return s.players[0] || s.name;
  }
  function career(list) {
    const map = new Map(), pairs = new Map();
    list.filter(isDone).forEach(g => {
      const t = totalsOf(g), w = winnersOf(g);
      g.sides.forEach((s, i) => {
        const won = w.includes(i);
        s.players.forEach(name => {
          if (guest(name)) return;
          const k = pkey(name);
          let p = map.get(k);
          if (!p) { p = { k, name: "", gp: 0, wins: 0, shared: 0, sum: 0, best: null, worst: null, streak: 0, bestStreak: 0 }; map.set(k, p); }
          p.name = String(name).trim();

        });
        const named = s.players.filter(n => !guest(n));
        if (s.players.length === 2 && named.length === 2) {
          const pk = named.map(pkey).sort().join("|");
          const r = pairs.get(pk) || { names: named.map(n => String(n).trim()).sort((a, b) => a.localeCompare(b)), gp: 0, wins: 0 };

    });

    const teams = [...pairs.values()].sort((a, b) => b.wins - a.wins || b.gp - a.gp || a.names.join().localeCompare(b.names.join()));

  }
  const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "–";
  const avg = (a, b) => b ? num(Math.round(a / b)) : "–";

  // ----- views -----
  function button() { return `<button class="small ghost" data-hx="open" id="hx-open" type="button">History</button>`; }
  function note() { return `<p class="hint">Saved in History with today's date.</p>`; }
  function unbacked() { let at = 0; try { at = +localStorage.getItem(BKEY) || 0; } catch (err) { /* ignore */ } return games.filter(isDone).length - at; }
  function award(t, w, d) { return `<div class="hx-award"><span class="hx-an">${t}</span><span class="hx-aw">${w}</span><span class="hx-ad">${d}</span></div>`; }

  function recordsView(done, stats) {
    if (!done.length) return "";
    const items = [];

    });

    const names = who => e([...new Set(who.map(x => x.who))].slice(0, 3).join(", ")) + (new Set(who.map(x => x.who)).size > 3 ? "…" : "");

<script>
// Opens without internet: a service worker keeps this app on the phone. Games and history are saved on the phone either way.
if ("serviceWorker" in navigator && window.isSecureContext && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
try { if (navigator.storage && navigator.storage.persist && !localStorage.getItem("cards-presidents-persist")) { localStorage.setItem("cards-presidents-persist", "1"); navigator.storage.persist(); } } catch (e) {}
</script>
<!-- offline:end -->
<!-- cardnight:start -->
<script>
// Opened from Card Night (one Home Screen icon for every card game): a link back to the game list.
(function(){
  try{ if (sessionStorage.getItem("card-night") !== "1") return; }catch(e){ return; }
  var app = document.getElementById("app"), st = document.createElement("style"), bar = document.createElement("div");
  st.textContent = ".cn-bar{margin:10px auto 6px}.cn-back{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 14px;border-radius:999px;border:1px solid var(--line,rgba(128,128,128,.4));background:var(--surface,transparent);color:var(--ink,inherit);font-family:inherit;font-size:14px;font-weight:700;line-height:1.2;text-decoration:none}";
  document.head.appendChild(st);
  bar.className = "cn-bar"; bar.innerHTML = '<a class="cn-back" href="/card-night/" id="cn-back"><span aria-hidden="true">‹</span> All games</a>';
  if (app){ bar.style.maxWidth = getComputedStyle(app).maxWidth; app.parentNode.insertBefore(bar, app); } else document.body.insertBefore(bar, document.body.firstChild);
})();
</script>
<!-- cardnight:end -->
</body>
</html>
